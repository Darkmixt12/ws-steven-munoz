<div class="kpi-container">
  @for (kpi of kpis(); track kpi.label) {

  <div class="kpi-card">
    <div class="kpi-top">
      <div class="kpi-title">
        <!-- Icono con color personalizado -->
        <div class="kpi-icon" [style.background]="kpi.customColor">
          <i [class]="kpi.icon"></i>
        </div>

        <span>{{ kpi.label }}</span>
      </div>

      @if (kpi.trend) {
        <span class="kpi-badge"> ↗ {{ kpi.trend }}% </span>
      }
    </div>

    <div class="kpi-value">
      @if (kpi.format === 'currency') {
        {{ kpi.value | currency : 'USD' : 'symbol' : '1.0-0' }}
      } @else if (kpi.format === 'percent') {
        {{ kpi.value }}%
      } @else {
        {{ kpi.value }}
      }
    </div>

    <div class="kpi-bar">
      <!-- Barra de progreso con color personalizado -->
      <div
        class="kpi-progress"
        [style.width.%]="kpi.progress"
        [style.background]="kpi.customColor"
      ></div>
    </div>
  </div>

  }
</div>
