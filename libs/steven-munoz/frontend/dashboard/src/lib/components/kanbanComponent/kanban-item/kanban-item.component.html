<div class="bg-white p-4 rounded-lg shadow-md cursor-pointer">
  @let ticket = item();

  <div class="title-btn">
    <h3 class="titletest font-semibold mb-4">{{ ticket.title }}</h3>
    <div>
      <p-confirmdialog />

      <div>
        <p-button
          severity="info"
          icon="pi pi-ellipsis-v"
          styleClass="p-button-text p-button-rounded p-button-sm"
          (click)="popover.toggle($event)"
        >
        </p-button>

        <p-popover #popover panelStyleClass="ticket-popover">
          <div class="menu-option" (click)="onEdit(popover,  $event, ticket)">
            <i class="pi pi-pencil"></i>
            Editar
          </div>

          <div class="menu-option danger" (click)="onDelete(popover, $event, ticket.id)">
            <i class="pi pi-trash"></i>
            Eliminar
          </div>
        </p-popover>
      </div>
    </div>
  </div>

  <p class="text-sm">{{ ticket.description }}</p>

  <p class="text-sm"><b>Amount:</b> {{ ticket.proposal | currency }}</p>

  <div class="chips">
    <p-chip
      class="image-chip"
      label="{{ ticket.assignee }}"
      image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
      alt="Avatar image"
    />

    <div class="priority">
      <span class="dot" [ngClass]="priorityColor(ticket.priority)"></span>
      <span class="label">{{ ticket.priority }}</span>
    </div>
  </div>
</div>
