<div class="bg-white p-4 rounded-lg shadow-md cursor-pointer">
  @let ticket = item();

  <h3 class="titletest font-semibold mb-4">{{ ticket.title }}</h3>

  <p class="text-sm">{{ ticket.description }}</p>

  <p class="text-sm"><b>Amount:</b> {{ ticket.proposal | currency }}</p>

  <div class="chips">
    <p-chip
      class="image-chip"
      label="{{ ticket.assignee }}"
      image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
      alt="Avatar image"
    />

    <div class="priority">
      <span class="dot" [ngClass]="priorityColor(ticket.priority)"></span>
      <span class="label">{{ ticket.priority }}</span>
    </div>
  </div>
</div>
