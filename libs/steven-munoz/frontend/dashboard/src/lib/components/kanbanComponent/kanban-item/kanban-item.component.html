<div class="bg-white p-4 rounded-lg shadow-md cursor-pointer">
  @let ticketSignal = ticket();

  <div class="title-btn">
    <h3 class="titletest font-semibold mb-4">{{ ticketSignal.title }}</h3>
    <div>
      <div (click)="$event.stopPropagation()">
        <p-button
          severity="info"
          icon="pi pi-ellipsis-v"
          styleClass="p-button-text p-button-rounded p-button-sm"
          (click)="popover.toggle($event)"
        >
        </p-button>

        <p-popover #popover panelStyleClass="ticket-popover">
          <div
            class="menu-option"
            (click)="onEdit(popover, $event, ticketSignal)"
          >
            <i class="pi pi-pencil"></i>
            Editar
          </div>

          <div
            class="menu-option"
            (click)="onHistory(popover, $event, ticketSignal.id)"
          >
            <i class="pi pi-history"></i>
            Historial
          </div>

          <div
            class="menu-option danger"
            (click)="onDelete(popover, $event, ticketSignal.id)"
          >
            <i class="pi pi-trash"></i>
            Eliminar
          </div>
        </p-popover>
      </div>
    </div>
  </div>

  <p class="text-sm">{{ ticketSignal.client }}</p>

  <p class="text-sm-proposal">{{ ticketSignal.proposal | currency : 'USD' : 'symbol' : '1.0-0'  }}</p>

  <div class="chips">
    <p-chip
      class="image-chip"
      label="{{ ticketSignal.assignee }}"
      image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
      alt="Avatar image"
    />

    <div class="priority">
      <div class="item-timer" style="opacity: 0.8">
        <div class="kpi-icon">
          <i class="pi pi-stopwatch"></i>
        </div>

        <span>{{ store.ticketAgingMap().get(ticketSignal.id) }}d</span>
      </div>
      <span class="dot" [ngClass]="priorityColor(ticketSignal.priority)"></span>
      <span class="label">{{ ticketSignal.priority }}</span>
    </div>
  </div>
</div>
